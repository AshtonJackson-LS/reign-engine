name: Release

# Pushing a version tag like v0.2.0 (release.bat does it) tests the code,
# builds every platform at once, then signs and publishes them together.
# Setup and troubleshooting: RELEASING.md.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  # Built into the hub: where it looks for updates and which key it trusts,
  # so a fork's hubs follow only the fork. Unset means the official key.
  REIGN_UPDATE_REPO: ${{ github.repository }}
  REIGN_UPDATE_PUBKEY: ${{ vars.REIGN_UPDATE_PUBKEY }}

jobs:
  check:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: The tag matches the version in Cargo.toml
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match Cargo.toml (v$version). Use release.bat, which keeps them in step."
            exit 1
          fi
      - name: Install gamepad and audio headers
        run: sudo apt-get update -q && sudo apt-get install -y -q pkg-config libudev-dev libasound2-dev
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace --all-features

  build:
    name: Build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: windows-x64, os: windows-latest }
          - { name: windows-arm64, os: windows-latest }
          - { name: macos, os: macos-latest }
          - { name: linux-x64, os: ubuntu-latest }
          - { name: linux-arm64, os: ubuntu-24.04-arm }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.name }}

      - name: Build Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $arch = '${{ matrix.name }}' -replace '^windows-', ''
          rustup target add $(if ($arch -eq 'arm64') { 'aarch64-pc-windows-msvc' } else { 'x86_64-pc-windows-msvc' })
          ./scripts/build-setup.ps1 -Arch $arch
      - name: Build macOS
        if: runner.os == 'macOS'
        run: scripts/bundle-macos.sh
      - name: Build Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q pkg-config libudev-dev libasound2-dev
          scripts/package-linux.sh

      # Signing happens in `publish`, with this build's copy of the signer.
      - name: Keep the signer
        if: matrix.name == 'linux-x64'
        run: cp target/release/reign-release dist/
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          if-no-files-found: error
          path: |
            dist/*.exe
            dist/*.zip
            dist/*.tar.gz
            dist/reign-release

  publish:
    name: Sign and publish
    needs: [check, build]
    runs-on: ubuntu-latest
    # If this environment has required reviewers, the run waits here for one
    # of them to approve it.
    environment: release
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Sign
        env:
          REIGN_RELEASE_KEY: ${{ secrets.REIGN_RELEASE_KEY }}
        run: |
          if [ -z "$REIGN_RELEASE_KEY" ]; then
            echo "::error::No REIGN_RELEASE_KEY secret in the release environment. See RELEASING.md, one-time setup."
            exit 1
          fi
          cd dist
          chmod +x reign-release
          for archive in *.zip *.tar.gz; do
            ./reign-release sign "$archive" "$GITHUB_REF_NAME"
            # Proves the secret matches the public key built into the hubs.
            if ! ./reign-release verify "$archive" "$GITHUB_REF_NAME"; then
              echo "::error::REIGN_RELEASE_KEY doesn't match the public key built into the hub (RELEASING.md, \"Lost or leaked key\")."
              exit 1
            fi
          done
          rm reign-release
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cat > notes.md <<'EOF'
          ## Install

          | | Download |
          | --- | --- |
          | **Windows** | **ReignSetup.exe** (or **ReignSetup-arm64.exe** on ARM PCs). If Windows says "Windows protected your PC", click **More info → Run anyway**. |
          | **macOS** | **reign-macos.zip** (Apple Silicon and Intel). Unzip, move **Reign Hub** to Applications, then right-click it → **Open** the first time. |
          | **Linux** | **reign-linux-x64.tar.gz** or **reign-linux-arm64.tar.gz**. Unpack and run `./reign-hub`. |

          Already have Reign? The hub installs this update by itself; restart it with the green arrow.

          Writing your own components needs Rust: https://rustup.rs
          EOF
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "Reign $GITHUB_REF_NAME" --notes-file notes.md --generate-notes
