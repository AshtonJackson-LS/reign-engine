name: Release

# Every push to main: CI, then
#   - after a Release PR is merged, the stable release of its version;
#   - otherwise a beta (v0.3.0-beta.4) for hubs with Beta updates on, and
#     the Release PR is brought up to date.
# How it decides: scripts/plan-release.sh. Setup: RELEASING.md.

on:
  push:
    branches: [main]
  workflow_dispatch:

# One release at a time, in order.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  actions: write

env:
  CARGO_TERM_COLOR: always
  # Built into the hub: where it looks for updates and which key it trusts,
  # so a fork's hubs follow only the fork. Unset means the official key.
  REIGN_UPDATE_REPO: ${{ github.repository }}
  REIGN_UPDATE_PUBKEY: ${{ vars.REIGN_UPDATE_PUBKEY }}

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  plan:
    name: Plan
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.plan.outputs.mode }}
      version: ${{ steps.plan.outputs.version }}
      next: ${{ steps.plan.outputs.next }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: plan
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/plan-release.sh | tee -a "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        if: steps.plan.outputs.mode != 'none'
        with:
          name: release-notes
          path: release-notes.md

  release-pr:
    name: Update the Release PR
    needs: plan
    if: needs.plan.outputs.mode == 'beta'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/download-artifact@v4
        with:
          name: release-notes
      - env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/update-release-pr.sh "${{ needs.plan.outputs.next }}"

  build:
    name: Build (${{ matrix.name }})
    needs: plan
    if: needs.plan.outputs.mode != 'none'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: windows-x64, os: windows-latest }
          - { name: windows-arm64, os: windows-latest }
          - { name: macos, os: macos-latest }
          - { name: linux-x64, os: ubuntu-latest }
          - { name: linux-arm64, os: ubuntu-24.04-arm }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.name }}
      - name: Set the version
        shell: bash
        run: scripts/set-version.sh "${{ needs.plan.outputs.version }}"

      - name: Build Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $arch = '${{ matrix.name }}' -replace '^windows-', ''
          rustup target add $(if ($arch -eq 'arm64') { 'aarch64-pc-windows-msvc' } else { 'x86_64-pc-windows-msvc' })
          ./scripts/build-setup.ps1 -Arch $arch
      - name: Build macOS
        if: runner.os == 'macOS'
        run: scripts/bundle-macos.sh
      - name: Build Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q pkg-config libudev-dev libasound2-dev
          scripts/package-linux.sh

      # Signing happens in `publish`, with this build's copy of the signer.
      - name: Keep the signer
        if: matrix.name == 'linux-x64'
        run: cp target/release/reign-release dist/
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          if-no-files-found: error
          path: |
            dist/*.exe
            dist/*.zip
            dist/*.tar.gz
            dist/reign-release

  publish:
    name: Sign and publish
    needs: [test, plan, build]
    runs-on: ubuntu-latest
    # If this environment has required reviewers, the run waits here for one
    # of them to approve it.
    environment: release
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      MODE: ${{ needs.plan.outputs.mode }}
      TAG: v${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Sign
        env:
          REIGN_RELEASE_KEY: ${{ secrets.REIGN_RELEASE_KEY }}
        run: |
          if [ -z "$REIGN_RELEASE_KEY" ]; then
            echo "::error::No REIGN_RELEASE_KEY secret in the release environment. See RELEASING.md, one-time setup."
            exit 1
          fi
          cd dist
          chmod +x reign-release
          for archive in *.zip *.tar.gz; do
            ./reign-release sign "$archive" "$TAG"
            # Proves the secret matches the public key built into the hubs.
            if ! ./reign-release verify "$archive" "$TAG"; then
              echo "::error::REIGN_RELEASE_KEY doesn't match the public key built into the hub (RELEASING.md, \"Lost or leaked key\")."
              exit 1
            fi
          done
          rm reign-release
          mv release-notes.md ../changes.md
      - name: Publish
        run: |
          if [ "$MODE" = beta ]; then
            intro="A beta: what's been merged since the last release. Hubs get it with **Settings → Beta updates** on."
          else
            intro="Installed hubs update to this release by themselves."
          fi
          cat > notes.md <<EOF
          $intro

          $(cat changes.md)

          ## Install

          | | Download |
          | --- | --- |
          | **Windows** | **ReignSetup.exe** (or **ReignSetup-arm64.exe** on ARM PCs). If Windows says "Windows protected your PC", click **More info → Run anyway**. |
          | **macOS** | **reign-macos.zip** (Apple Silicon and Intel). Unzip, move **Reign Hub** to Applications, then right-click it → **Open** the first time. |
          | **Linux** | **reign-linux-x64.tar.gz** or **reign-linux-arm64.tar.gz**. Unpack and run \`./reign-hub\`. |

          Writing your own components needs Rust: https://rustup.rs
          EOF
          flags=()
          if [ "$MODE" = beta ]; then flags=(--prerelease); fi
          gh release create "$TAG" dist/* --target "$GITHUB_SHA" \
            --title "Reign $TAG" --notes-file notes.md "${flags[@]}"
      - name: Remove old betas
        # Keeps the newest three. Their tags stay: projects made with a beta
        # still fetch their engine from them.
        run: |
          gh release list --limit 100 --json tagName,isPrerelease \
            --jq '[.[] | select(.isPrerelease)] | .[3:] | .[].tagName' |
            while read -r tag; do gh release delete "$tag" --yes; done
