# License and supply-chain policy. CI fails if any dependency breaks it.
[graph]
all-features = true
# Only the platforms we ship. Linux-only crates (Wayland decorations) are skipped.
targets = [
    "x86_64-pc-windows-msvc",
    "aarch64-pc-windows-msvc",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
]

[licenses]
# Reign itself is MPL-2.0. Dependencies must be permissive, or MPL-2.0 like
# the engine: file-level copyleft, so a game built on Reign only has to share
# changes it makes to those files, never its own source.
allow = [
    "MPL-2.0",
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "BSL-1.0",
    "CC0-1.0",
    "Unicode-3.0",
    "Unlicense",
]
confidence-threshold = 0.9
# Pre-approved for crates we expect to add (audio, assets).
unused-allowed-license = "allow"
# egui's bundled fonts, used by the editor only. These licenses cover the font
# files themselves and put no obligation on Reign's source or on games built
# with it.
exceptions = [
    { crate = "epaint_default_fonts", allow = ["OFL-1.1", "Ubuntu-font-1.0"] },
]

[licenses.private]
# Our own crates are checked too: each says MPL-2.0 (from the workspace).
ignore = false

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[advisories]
yanked = "warn"
# Fail on security advisories anywhere, but on "unmaintained" notices only for
# crates we depend on directly; transitive ones are the upstream's to replace.
unmaintained = "workspace"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
