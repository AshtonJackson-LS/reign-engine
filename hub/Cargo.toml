[package]
name = "reign_hub"
description = "Reign Hub: create, find and open Reign Engine projects"
version.workspace = true
edition.workspace = true
rust-version = "1.95"
license.workspace = true
publish.workspace = true

[[bin]]
name = "reign-hub"
path = "src/main.rs"

[dependencies]
# Same egui and wgpu versions as the editor, so the two share one build.
eframe = { version = "0.36", default-features = false, features = ["wgpu", "default_fonts", "accesskit", "wayland", "x11"] }
rfd = "0.15"
serde.workspace = true
ron.workspace = true
log.workspace = true
env_logger.workspace = true
png.workspace = true
reign_build.workspace = true
