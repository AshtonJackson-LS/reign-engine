[package]
name = "reign_hub"
description = "Reign Hub: create, find and open Reign Engine projects"
version.workspace = true
edition.workspace = true
rust-version = "1.95"
license.workspace = true
publish.workspace = true

[[bin]]
name = "reign-hub"
path = "src/main.rs"

# Makes the release key and signs releases (see hub/src/bin/reign-release.rs).
[[bin]]
name = "reign-release"
path = "src/bin/reign-release.rs"

[dependencies]
# Same egui and wgpu versions as the editor, so the two share one build.
eframe = { version = "0.36", default-features = false, features = ["wgpu", "default_fonts", "accesskit", "wayland", "x11"] }
rfd = "0.15"
serde.workspace = true
ron.workspace = true
log.workspace = true
env_logger.workspace = true
png.workspace = true
reign_build.workspace = true
# Install, uninstall and the Settings → Apps entry (shared with ReignSetup).
reign_setup = { path = "../installer" }
# Checks that an update was signed with the release key.
ed25519-dalek = "2"
getrandom = "0.3"

# Gives the Windows .exe its icon (taskbar, Desktop, Start menu search).
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
